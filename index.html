<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Turf Tank Ops — OC Parks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0a0d12;
  --bg-card: #12161e;
  --bg-card-hover: #181e2a;
  --bg-input: #0e1118;
  --bg-surface: #161b26;
  --border: #1c2333;
  --border-active: #2a3a5c;
  --text-primary: #e8ecf4;
  --text-secondary: #7a8599;
  --text-muted: #4a5568;
  --accent-orange: #f97316;
  --accent-orange-dim: rgba(249,115,22,0.12);
  --accent-blue: #3b82f6;
  --accent-green: #22c55e;
  --accent-red: #ef4444;
  --accent-yellow: #eab308;
  --accent-purple: #a855f7;
  --accent-cyan: #06b6d4;
  --truck1: #f97316;
  --truck2: #3b82f6;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 2px 16px rgba(0,0,0,0.5);
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'DM Sans', -apple-system, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html { font-size: 15px; }
body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── NAV BAR ── */
.nav-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(10,13,18,0.94);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center;
  padding: 4px 2px calc(4px + var(--safe-bottom));
  z-index: 100;
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  background: none; border: none; color: var(--text-muted);
  font: 500 9px var(--font-sans);
  padding: 5px 2px; border-radius: 8px;
  cursor: pointer; transition: all 0.2s;
  min-width: 44px; letter-spacing: 0.2px;
}
.nav-btn.active { color: var(--accent-orange); }
.nav-btn.active .nav-icon { background: var(--accent-orange-dim); }
.nav-icon {
  width: 30px; height: 30px; display: flex; align-items: center;
  justify-content: center; border-radius: 8px; transition: all 0.2s;
}

/* ── HEADER ── */
.app-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(10,13,18,0.90);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 10px;
}
.header-top { display: flex; align-items: center; gap: 10px; }
.header-logo {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent-orange), #ea580c);
  display: flex; align-items: center; justify-content: center;
  font: 700 14px var(--font-mono); color: #fff;
  flex-shrink: 0; box-shadow: 0 2px 12px rgba(249,115,22,0.25);
}
.header-title {
  font: 700 18px var(--font-sans); color: var(--text-primary);
  letter-spacing: -0.4px;
}
.header-sub {
  font: 500 11px var(--font-sans); color: var(--text-secondary);
  margin-top: -1px;
}

/* ── SEARCH ── */
.search-wrap { margin: 10px 0 0; position: relative; }
.search-input {
  width: 100%; padding: 10px 12px 10px 36px;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text-primary);
  font: 400 14px var(--font-sans); outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent-orange); }
.search-input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none;
}

/* ── CONTENT ── */
.content {
  padding: 10px 12px calc(72px + var(--safe-bottom));
  max-width: 800px; margin: 0 auto;
}

/* ── CARDS ── */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 8px;
  overflow: hidden; transition: all 0.15s;
}
.card:active { transform: scale(0.995); }
.card-header {
  padding: 12px 14px; display: flex; align-items: center;
  justify-content: space-between; cursor: pointer;
}
.card-title {
  font: 600 14px var(--font-sans); color: var(--text-primary);
  display: flex; align-items: center; gap: 8px;
}
.card-badge { font: 600 10px var(--font-mono); padding: 2px 7px; border-radius: 4px; letter-spacing: 0.5px; }
.badge-t1 { background: rgba(249,115,22,0.15); color: var(--truck1); }
.badge-t2 { background: rgba(59,130,246,0.15); color: var(--truck2); }
.badge-count {
  font: 600 11px var(--font-mono); color: var(--text-muted);
  background: rgba(255,255,255,0.04); padding: 2px 6px; border-radius: 4px;
}
.card-body { padding: 0 14px 14px; }
.card-chevron { color: var(--text-muted); transition: transform 0.2s; }
.card-chevron.open { transform: rotate(90deg); }

/* ── DATA ROWS ── */
.data-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
  font-size: 13px;
}
.data-row:last-child { border-bottom: none; }
.data-label { color: var(--text-secondary); flex: 1; }
.data-value { color: var(--text-primary); font-weight: 500; text-align: right; flex: 1; }
.data-value.mono { font-family: var(--font-mono); font-size: 12px; }

/* ── COLOR DOT ── */
.color-dot {
  display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; margin-right: 6px; vertical-align: middle;
  border: 1px solid rgba(255,255,255,0.1);
}
.color-dot.white { background: #f1f5f9; }
.color-dot.red { background: #ef4444; }
.color-dot.blue { background: #3b82f6; }
.color-dot.yellow { background: #eab308; }

/* ── GPS BUTTON ── */
.gps-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2);
  color: var(--accent-green); padding: 6px 12px; border-radius: var(--radius-sm);
  font: 500 12px var(--font-sans); cursor: pointer;
  text-decoration: none; transition: all 0.15s;
}
.gps-btn:hover { background: rgba(34,197,94,0.18); }
.gps-btn:active { transform: scale(0.97); }

/* ── SECTION TITLE ── */
.section-title {
  font: 700 11px var(--font-mono); color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 1.5px;
  padding: 14px 4px 8px; display: flex; align-items: center; gap: 8px;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to right, var(--border), transparent);
}

/* ── ROUTE TIMELINE ── */
.route-day {
  display: flex; gap: 12px; padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
.route-day:last-child { border-bottom: none; }
.route-day-name {
  font: 700 12px var(--font-mono); color: var(--accent-orange);
  min-width: 36px; padding-top: 1px;
}
.route-day-name.t2 { color: var(--accent-blue); }
.route-detail { flex: 1; }
.route-sites { font: 600 13px var(--font-sans); color: var(--text-primary); }
.route-region { font: 400 11px var(--font-sans); color: var(--text-secondary); margin-top: 2px; }
.route-fields { font: 400 12px var(--font-sans); color: var(--text-muted); margin-top: 3px; }

/* ── TRUCK TOGGLE ── */
.truck-toggle {
  display: flex; background: var(--bg-input); border-radius: var(--radius);
  padding: 3px; gap: 3px; margin-bottom: 12px;
  border: 1px solid var(--border);
}
.truck-toggle-btn {
  flex: 1; padding: 8px; border: none; border-radius: 9px;
  font: 600 12px var(--font-sans); cursor: pointer;
  background: transparent; color: var(--text-muted); transition: all 0.2s;
}
.truck-toggle-btn.active-t1 { background: rgba(249,115,22,0.15); color: var(--truck1); }
.truck-toggle-btn.active-t2 { background: rgba(59,130,246,0.15); color: var(--truck2); }

/* ── INVENTORY TABLE ── */
.inv-table { width: 100%; }
.inv-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
  font-size: 13px;
}
.inv-row:last-child { border-bottom: none; }
.inv-item { color: var(--text-primary); flex: 1; }
.inv-qty {
  font: 600 13px var(--font-mono); color: var(--accent-green);
  min-width: 40px; text-align: right;
}
.inv-qty.none { color: var(--text-muted); }

/* ── SUPPLY STATUS ── */
.supply-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px;
  margin-bottom: 6px;
}
.supply-name { font: 600 14px var(--font-sans); color: var(--text-primary); }
.supply-meta {
  display: flex; gap: 16px; margin-top: 6px;
  font: 400 12px var(--font-sans); color: var(--text-secondary);
}

/* ── STATION CARD ── */
.station-group {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 8px; overflow: hidden;
}
.station-group-header {
  padding: 12px 14px; display: flex; align-items: center;
  justify-content: space-between;
}
.station-group-name { font: 600 14px var(--font-sans); color: var(--text-primary); }
.station-point {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; border-top: 1px solid rgba(255,255,255,0.03);
}
.station-coords { font: 400 12px var(--font-mono); color: var(--text-secondary); }
.station-note { font: 400 11px var(--font-sans); color: var(--text-muted); margin-top: 2px; }

/* ── CONTACT CARD ── */
.contact-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px;
}
.contact-site { font: 600 14px var(--font-sans); color: var(--text-primary); }
.contact-info { margin-top: 8px; font-size: 13px; }
.contact-info a { color: var(--accent-blue); text-decoration: none; }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 40px 20px;
  color: var(--text-muted); font-size: 14px;
}

/* ── SOP STYLES ── */
.sop-section {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 8px; overflow: hidden;
}
.sop-section-header {
  padding: 12px 14px; display: flex; align-items: center;
  justify-content: space-between; cursor: pointer;
  transition: background 0.15s;
}
.sop-section-header:active { background: var(--bg-card-hover); }
.sop-section-title {
  font: 600 14px var(--font-sans); color: var(--text-primary);
  display: flex; align-items: center; gap: 8px;
}
.sop-step-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--accent-orange-dim); color: var(--accent-orange);
  font: 700 11px var(--font-mono); flex-shrink: 0;
}
.sop-step {
  display: flex; gap: 10px; padding: 8px 14px;
  border-top: 1px solid rgba(255,255,255,0.03);
  font: 400 13px var(--font-sans); color: var(--text-primary);
  line-height: 1.5;
}
.sop-warning {
  display: flex; gap: 8px; padding: 8px 14px;
  border-top: 1px solid rgba(255,255,255,0.03);
  background: rgba(234,179,8,0.06);
  font: 500 12px var(--font-sans); color: var(--accent-yellow);
  line-height: 1.5; align-items: flex-start;
}
.sop-check {
  display: flex; gap: 8px; padding: 6px 14px;
  border-top: 1px solid rgba(255,255,255,0.03);
  font: 400 13px var(--font-sans); color: var(--text-secondary);
  align-items: center; cursor: pointer; transition: all 0.15s;
}
.sop-check:active { background: rgba(255,255,255,0.02); }
.sop-checkbox {
  width: 18px; height: 18px; border-radius: 5px;
  border: 1.5px solid var(--border-active); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; cursor: pointer;
}
.sop-checkbox.checked {
  background: var(--accent-green); border-color: var(--accent-green);
}
.sop-pill-row {
  display: flex; gap: 6px; overflow-x: auto; padding: 0 4px 8px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.sop-pill-row::-webkit-scrollbar { display: none; }
.sop-pill {
  flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-secondary); font: 500 12px var(--font-sans);
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.sop-pill.active {
  background: var(--accent-orange-dim); border-color: rgba(249,115,22,0.3);
  color: var(--accent-orange);
}

/* ── PAINT USAGE ── */
.usage-summary-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  margin-bottom: 12px;
}
.usage-summary-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 12px; text-align: center;
}
.usage-summary-color {
  font: 700 10px var(--font-mono); text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 4px;
}
.usage-summary-gal {
  font: 700 20px var(--font-mono); color: var(--text-primary);
}
.usage-summary-unit {
  font: 400 10px var(--font-sans); color: var(--text-muted);
}
.usage-bar-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; font-size: 12px;
}
.usage-bar-label {
  font: 500 12px var(--font-sans); color: var(--text-secondary);
  min-width: 90px; flex-shrink: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.usage-bar-track {
  flex: 1; height: 18px; background: rgba(255,255,255,0.03);
  border-radius: 4px; overflow: hidden; position: relative;
}
.usage-bar-fill {
  height: 100%; border-radius: 4px;
  transition: width 0.4s ease-out;
  min-width: 2px;
}
.usage-bar-val {
  font: 600 11px var(--font-mono); color: var(--text-secondary);
  min-width: 36px; text-align: right; flex-shrink: 0;
}
.usage-grand {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 12px 14px; border-top: 1px solid var(--border);
  background: rgba(249,115,22,0.04);
}
.usage-grand-label {
  font: 700 12px var(--font-mono); color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 1px;
}
.usage-grand-val {
  font: 700 22px var(--font-mono); color: var(--accent-orange);
}
.usage-weeks-note {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 6px 0 2px;
  font: 500 11px var(--font-sans); color: var(--text-muted);
}

/* ── ANIMATIONS ── */
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.25s ease-out; }

/* ── DESKTOP ── */
@media (min-width: 640px) {
  .content { padding: 16px 24px calc(80px + var(--safe-bottom)); }
  .nav-bar { max-width: 520px; left: 50%; transform: translateX(-50%); bottom: 12px; border-radius: 16px; border: 1px solid var(--border); }
}
</style>
</head>

function ColorDot({color}) {
  const c = (color||'').toLowerCase();
  const match = c.includes('red') ? 'red' : c.includes('blue') ? 'blue' : c.includes('yellow') ? 'yellow' : c.includes('white') ? 'white' : '';
  return <span className={`color-dot ${match}`}/>;
}

// ── Fields View ──
function FieldsView({search}) {
  const [selectedSite, setSelectedSite] = useState(null);
  const sites = useMemo(() => {
    const map = {};
    FIELDS.forEach(f => { if (!map[f.site]) map[f.site] = []; map[f.site].push(f); });
    return Object.entries(map);
  }, []);

  const filtered = useMemo(() => {
    if (!search) return sites;
    const q = search.toLowerCase();
    return sites.filter(([name, fields]) =>
      name.toLowerCase().includes(q) || fields.some(f => f.field.toLowerCase().includes(q) || (f.color||'').toLowerCase().includes(q))
    );
  }, [sites, search]);

  return (
    <div className="fade-in">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 4px 4px'}}>
        <div className="section-title" style={{padding:0}}>
          {filtered.length} Sites — {filtered.reduce((n,[,f])=>n+f.length,0)} Fields
        </div>
        <span style={{background:'rgba(34,197,94,0.12)',border:'1px solid rgba(34,197,94,0.25)',color:'var(--accent-green)',padding:'4px 12px',borderRadius:'20px',font:'600 11px var(--font-mono)',letterSpacing:'0.5px'}}>WEEKLY</span>
      </div>
      {filtered.map(([site, fields]) => (
        <div className="card" key={site}>
          <div className="card-header" onClick={()=>setSelectedSite(selectedSite===site?null:site)}>
            <div className="card-title">
              {site}
              <span className="badge-count">{fields.length}</span>
            </div>
            <span className={`card-chevron ${selectedSite===site?'open':''}`}><Icon name="chevron" size={14}/></span>
          </div>
          {selectedSite===site && (
            <div className="card-body fade-in">
              {fields.map((f,i) => (
                <div key={i} style={{padding:'7px 0',borderBottom:'1px solid rgba(255,255,255,0.03)'}}>
                  <div className="data-row" style={{borderBottom:'none',padding:0}}>
                    <span className="data-label"><ColorDot color={f.color}/>{f.field}</span>
                    <span className="data-value" style={{fontSize:'12px',color:'var(--text-secondary)'}}>{f.dimensions || '—'}</span>
                  </div>
                  {(f.whoPaints || f.notes) && (
                    <div style={{marginTop:'3px',marginLeft:'16px',fontSize:'11px',display:'flex',gap:'10px',flexWrap:'wrap'}}>
                      {f.notes && <span style={{color:'var(--accent-yellow)'}}>{f.notes}</span>}
                      {f.whoPaints && <span style={{color:'var(--accent-purple)',fontStyle:'italic'}}>{f.whoPaints}</span>}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// ── Base Stations View ──
function StationsView({search}) {
  const [truckFilter, setTruckFilter] = useState('all');

  const grouped = useMemo(() => {
    const stations = truckFilter === 'all' ? STATIONS
      : STATIONS.filter(s => s.truck === (truckFilter === 'truck1' ? 1 : 2));
    const map = {};
    stations.forEach(s => { if (!map[s.site]) map[s.site] = []; map[s.site].push(s); });
    return Object.entries(map);
  }, [truckFilter]);

  const filtered = useMemo(() => {
    if (!search) return grouped;
    const q = search.toLowerCase();
    return grouped.filter(([name]) => name.toLowerCase().includes(q));
  }, [grouped, search]);

  const pointCount = filtered.reduce((n,[,pts]) => n + pts.length, 0);
  const openMaps = (lat, lng) => { window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`, '_blank'); };

  return (
    <div className="fade-in">
      <div className="truck-toggle">
        <button className={`truck-toggle-btn ${truckFilter==='all'?'active-t1':''}`} style={truckFilter==='all'?{background:'var(--accent-orange-dim)',color:'var(--accent-orange)'}:{}} onClick={()=>setTruckFilter('all')}>All Sites</button>
        <button className={`truck-toggle-btn ${truckFilter==='truck1'?'active-t1':''}`} onClick={()=>setTruckFilter('truck1')}>T1 — West/South</button>
        <button className={`truck-toggle-btn ${truckFilter==='truck2'?'active-t2':''}`} onClick={()=>setTruckFilter('truck2')}>T2 — East/SE</button>
      </div>
      <div className="section-title">{filtered.length} Sites — {pointCount} Points</div>
      {filtered.map(([site, points]) => (
        <div className="station-group" key={site}>
          <div className="station-group-header">
            <span className="station-group-name">{site}</span>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <span className={`card-badge ${points[0].truck===1?'badge-t1':'badge-t2'}`}>T{points[0].truck}</span>
              <span className="badge-count">{points.length} pt{points.length>1?'s':''}</span>
            </div>
          </div>
          {points.map((pt, i) => (
            <div className="station-point" key={i}>
              <div>
                <div className="station-coords">{pt.lat.toFixed(6)}, {pt.lng.toFixed(6)}</div>
              </div>
              <a className="gps-btn" onClick={(e)=>{e.preventDefault();openMaps(pt.lat,pt.lng)}} href="#">
                <Icon name="navigate" size={14}/> Navigate
              </a>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

// ── Supplies / Paint View ──
function SuppliesView() {
  const [paintTab, setPaintTab] = useState('inventory');
  const [usageTruck, setUsageTruck] = useState('combined');

  const aggregateBySite = (entries) => {
    const map = {};
    entries.forEach(e => {
      if (!map[e.site]) map[e.site] = {site: e.site, gal: 0, fields: []};
      map[e.site].gal += e.gal;
      map[e.site].fields.push(e);
    });
    return Object.values(map).sort((a,b) => b.gal - a.gal);
  };

  const usageData = useMemo(() => {
    let white, red, blue;
    if (usageTruck === 'combined') {
      white = [...PAINT_USAGE.truck1.white, ...PAINT_USAGE.truck2.white];
      red = [...PAINT_USAGE.truck1.red, ...PAINT_USAGE.truck2.red];
      blue = [...PAINT_USAGE.truck1.blue, ...PAINT_USAGE.truck2.blue];
    } else {
      const t = PAINT_USAGE[usageTruck];
      white = t.white; red = t.red; blue = t.blue;
    }
    const wTotal = white.reduce((s,e) => s + e.gal, 0);
    const rTotal = red.reduce((s,e) => s + e.gal, 0);
    const bTotal = blue.reduce((s,e) => s + e.gal, 0);
    const grand = wTotal + rTotal + bTotal;

    const allEntries = [
      ...white.map(e => ({...e, color:'white'})),
      ...red.map(e => ({...e, color:'red'})),
      ...blue.map(e => ({...e, color:'blue'})),
    ];
    const siteMap = {};
    allEntries.forEach(e => {
      if (!siteMap[e.site]) siteMap[e.site] = {site: e.site, gal: 0, white:0, red:0, blue:0};
      siteMap[e.site].gal += e.gal;
      siteMap[e.site][e.color] += e.gal;
    });
    const bySite = Object.values(siteMap).sort((a,b) => b.gal - a.gal);
    const maxSiteGal = bySite.length ? bySite[0].gal : 1;

    return { wTotal, rTotal, bTotal, grand, bySite, maxSiteGal };
  }, [usageTruck]);

  const weeksOfSupply = useMemo(() => {
    const inv = {};
    SUPPLIES.filter(s => s.unit === 'Robot').forEach(s => {
      const gals = parseFloat(s.notes);
      const color = s.item.includes('White') ? 'white' : s.item.includes('Blue') ? 'blue' : 'red';
      const weeklyUse = color === 'white' ? usageData.wTotal : color === 'red' ? usageData.rTotal : usageData.bTotal;
      inv[s.item] = weeklyUse > 0 ? Math.floor(gals / weeklyUse) : 999;
    });
    return inv;
  }, [usageData]);

  return (
    <div className="fade-in">
      <div className="sop-pill-row">
        <button className={`sop-pill ${paintTab==='inventory'?'active':''}`} onClick={()=>setPaintTab('inventory')}>Inventory</button>
        <button className={`sop-pill ${paintTab==='usage'?'active':''}`} onClick={()=>setPaintTab('usage')}>Weekly Usage</button>
      </div>

      {paintTab === 'usage' && (
        <div className="fade-in">
          <div className="section-title">Weekly Paint Consumption</div>

          <div style={{display:'flex',background:'var(--bg-input)',borderRadius:'var(--radius)',padding:3,gap:3,marginBottom:12,border:'1px solid var(--border)'}}>
            {[{id:'combined',label:'Both Trucks'},{id:'truck1',label:'Truck 1'},{id:'truck2',label:'Truck 2'}].map(t => (
              <button key={t.id} onClick={()=>setUsageTruck(t.id)} style={{
                flex:1, padding:8, border:'none', borderRadius:9,
                font:'600 12px var(--font-sans)', cursor:'pointer', transition:'all 0.2s',
                background: usageTruck===t.id ? 'var(--accent-orange-dim)' : 'transparent',
                color: usageTruck===t.id ? 'var(--accent-orange)' : 'var(--text-muted)',
              }}>{t.label}</button>
            ))}
          </div>

          {usageTruck !== 'combined' && (
            <div style={{textAlign:'center',font:'500 12px var(--font-sans)',color:'var(--text-secondary)',marginBottom:10}}>
              {PAINT_USAGE[usageTruck].label}
            </div>
          )}

          <div className="usage-summary-grid">
            {[{label:'White',val:usageData.wTotal,c:'#e2e8f0'},{label:'Red',val:usageData.rTotal,c:'#ef4444'},{label:'Blue',val:usageData.bTotal,c:'#3b82f6'}].map(x => (
              <div className="usage-summary-card" key={x.label}>
                <div className="usage-summary-color" style={{color:x.c}}>{x.label}</div>
                <div className="usage-summary-gal">{x.val.toFixed(1)}</div>
                <div className="usage-summary-unit">gallons</div>
              </div>
            ))}
          </div>

          <div className="card" style={{overflow:'hidden',marginBottom:12}}>
            <div className="usage-grand">
              <span className="usage-grand-label">Weekly Total</span>
              <div>
                <span className="usage-grand-val">{usageData.grand.toFixed(1)}</span>
                <span style={{font:'400 12px var(--font-sans)',color:'var(--text-muted)',marginLeft:4}}>gal</span>
              </div>
            </div>
          </div>

          <div className="section-title">Usage by Site</div>
          <div className="card">
            <div className="card-body" style={{paddingTop:12}}>
              {usageData.bySite.map((s,i) => (
                <div className="usage-bar-row" key={i}>
                  <span className="usage-bar-label">{s.site}</span>
                  <div className="usage-bar-track">
                    <div style={{display:'flex',height:'100%'}}>
                      {s.white > 0 && <div className="usage-bar-fill" style={{
                        width: `${(s.white / usageData.maxSiteGal) * 100}%`,
                        background: 'rgba(226,232,240,0.45)',
                      }}/>}
                      {s.red > 0 && <div className="usage-bar-fill" style={{
                        width: `${(s.red / usageData.maxSiteGal) * 100}%`,
                        background: 'rgba(239,68,68,0.5)',
                      }}/>}
                      {s.blue > 0 && <div className="usage-bar-fill" style={{
                        width: `${(s.blue / usageData.maxSiteGal) * 100}%`,
                        background: 'rgba(59,130,246,0.5)',
                      }}/>}
                    </div>
                  </div>
                  <span className="usage-bar-val">{s.gal.toFixed(1)}</span>
                </div>
              ))}
            </div>
          </div>

          <div style={{display:'flex',justifyContent:'center',gap:16,padding:'8px 0 4px'}}>
            {[{c:'rgba(226,232,240,0.45)',l:'White'},{c:'rgba(239,68,68,0.5)',l:'Red'},{c:'rgba(59,130,246,0.5)',l:'Blue'}].map(x => (
              <div key={x.l} style={{display:'flex',alignItems:'center',gap:5,font:'400 11px var(--font-sans)',color:'var(--text-muted)'}}>
                <span style={{width:10,height:10,borderRadius:3,background:x.c,display:'inline-block'}}/>
                {x.l}
              </div>
            ))}
          </div>
        </div>
      )}

      {paintTab === 'inventory' && (
        <div className="fade-in">
          <div className="section-title">Warehouse Inventory</div>
          {SUPPLIES.map((s,i) => {
            const weeks = weeksOfSupply[s.item];
            return (
              <div className="supply-card" key={i}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div className="supply-name">{s.item}</div>
                  <span style={{
                    font:'600 10px var(--font-mono)',padding:'3px 8px',borderRadius:'4px',
                    background: s.status==='Low' ? 'rgba(239,68,68,0.15)' : 'rgba(34,197,94,0.12)',
                    color: s.status==='Low' ? 'var(--accent-red)' : 'var(--accent-green)',
                  }}>{s.status}</span>
                </div>
                <div className="supply-meta">
                  <span>On hand: <strong style={{color:'var(--text-primary)'}}>{s.onHand}</strong></span>
                  <span>{s.notes}</span>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px',fontSize:'12px',color:'var(--text-muted)'}}>
                  <span>Supplier: {s.supplier}</span>
                  {weeks != null && weeks < 999 && (
                    <span style={{display:'flex',alignItems:'center',gap:4}}>
                      <span style={{color: weeks <= 4 ? 'var(--accent-red)' : weeks <= 8 ? 'var(--accent-yellow)' : 'var(--accent-green)', fontFamily:'var(--font-mono)', fontWeight:600}}>~{weeks} wk{weeks!==1?'s':''}</span>
                      <span>supply</span>
                    </span>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── Contacts View ──
function ContactsView({search}) {
  const filtered = useMemo(() => {
    if (!search) return CONTACTS;
    const q = search.toLowerCase();
    return CONTACTS.filter(c =>
      c.site.toLowerCase().includes(q) ||
      (c.name||'').toLowerCase().includes(q) ||
      (c.title||'').toLowerCase().includes(q)
    );
  }, [search]);

  // Group by site for multi-contact sites (e.g. Bear Creek has 2)
  const grouped = useMemo(() => {
    const map = {};
    filtered.forEach(c => {
      if (!map[c.site]) map[c.site] = [];
      map[c.site].push(c);
    });
    return Object.entries(map);
  }, [filtered]);

  return (
    <div className="fade-in">
      <div className="section-title">{grouped.length} Sites — {filtered.length} Contacts</div>
      {grouped.map(([site, contacts]) => (
        <div className="contact-card" key={site}>
          <div className="contact-site">{site}</div>
          {contacts.map((c,j) => (
            <div className="contact-info" key={j} style={j > 0 ? {borderTop:'1px solid rgba(255,255,255,0.05)',marginTop:8,paddingTop:8} : {}}>
              <div className="data-row">
                <span className="data-label">Name</span>
                <span className="data-value">{c.name || '—'}</span>
              </div>
              <div className="data-row">
                <span className="data-label">Title</span>
                <span className="data-value" style={{fontSize:'12px',color:'var(--text-secondary)'}}>{c.title || '—'}</span>
              </div>
              <div className="data-row">
                <span className="data-label">Office</span>
                {c.office ? <a href={`tel:${c.office.replace(/[^0-9]/g,'')}`} className="data-value" style={{color:'var(--accent-blue)',textDecoration:'none',fontFamily:'var(--font-mono)',fontSize:'12px'}}>{c.office}</a>
                : <span className="data-value" style={{color:'var(--text-muted)'}}>—</span>}
              </div>
              <div className="data-row">
                <span className="data-label">Cell</span>
                {c.cell ? <a href={`tel:${c.cell.replace(/[^0-9]/g,'')}`} className="data-value" style={{color:'var(--accent-blue)',textDecoration:'none',fontFamily:'var(--font-mono)',fontSize:'12px'}}>{c.cell}</a>
                : <span className="data-value" style={{color:'var(--text-muted)'}}>—</span>}
              </div>
              <div className="data-row">
                <span className="data-label">Email</span>
                {c.email ? <a href={`mailto:${c.email}`} className="data-value" style={{color:'var(--accent-blue)',textDecoration:'none',fontSize:'12px'}}>{c.email}</a>
                : <span className="data-value" style={{color:'var(--text-muted)'}}>—</span>}
              </div>
              <div className="data-row">
                <span className="data-label">Gate Code</span>
                <span className="data-value mono" style={{color:'var(--accent-orange)',letterSpacing:'2px'}}>{c.gate || '—'}</span>
              </div>
            </div>
          ))}
        </div>
      ))}
      <div className="card" style={{marginTop:12}}>
        <div className="card-header"><div className="card-title"><Icon name="phone" size={16}/> Support Contacts</div></div>
        <div className="card-body">
          <div className="data-row">
            <span className="data-label">Turf Tank Help</span>
            <a href="tel:8557969564" className="data-value" style={{color:'var(--accent-blue)',textDecoration:'none',fontFamily:'var(--font-mono)',fontSize:'12px'}}>855-796-9564</a>
          </div>
          <div className="data-row">
            <span className="data-label">Senior Park Specialist</span>
            <a href="tel:3213530311" className="data-value" style={{color:'var(--accent-blue)',textDecoration:'none',fontFamily:'var(--font-mono)',fontSize:'12px'}}>321-353-0311</a>
          </div>
          <div className="data-row">
            <span className="data-label">Parts Orders</span>
            <a href="mailto:orders@turftank.com" className="data-value" style={{color:'var(--accent-blue)',textDecoration:'none',fontSize:'12px'}}>orders@turftank.com</a>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── SOP View ──
function SOPView() {
  const [openSection, setOpenSection] = useState(null);
  const [checked, setChecked] = useState({});
  const [sopTab, setSopTab] = useState('procedures');

  const toggleCheck = (i) => setChecked(prev => ({...prev, [i]: !prev[i]}));
  const checkedCount = CHECKLIST_ITEMS.filter((_,i) => checked[i]).length;
  const sopKeys = Object.keys(SOP_DATA);

  return (
    <div className="fade-in">
      <div className="sop-pill-row">
        <button className={`sop-pill ${sopTab==='procedures'?'active':''}`} onClick={()=>setSopTab('procedures')}>Procedures</button>
        <button className={`sop-pill ${sopTab==='checklist'?'active':''}`} onClick={()=>setSopTab('checklist')}>Daily Checklist</button>
      </div>

      {sopTab === 'procedures' && (
        <div className="fade-in">
          <div className="section-title">Standard Operating Procedure</div>
          {sopKeys.map(key => {
            const section = SOP_DATA[key];
            const isOpen = openSection === key;
            return (
              <div className="sop-section" key={key}>
                <div className="sop-section-header" onClick={()=>setOpenSection(isOpen?null:key)}>
                  <div className="sop-section-title">
                    <span style={{opacity:0.6}}><Icon name={section.icon} size={16}/></span>
                    {section.title}
                  </div>
                  <span className={`card-chevron ${isOpen?'open':''}`}><Icon name="chevron" size={14}/></span>
                </div>
                {isOpen && section.steps.map((step, i) => {
                  if (step.type === 'warning') {
                    return (
                      <div className="sop-warning" key={i}>
                        <span style={{fontSize:'14px',flexShrink:0}}>⚠</span>
                        <span>{step.text}</span>
                      </div>
                    );
                  }
                  return (
                    <div className="sop-step" key={i}>
                      <span className="sop-step-num">{step.num}</span>
                      <span>{step.text}</span>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}

      {sopTab === 'checklist' && (
        <div className="fade-in">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 4px 4px'}}>
            <div className="section-title" style={{padding:0}}>Quick-Reference Checklist</div>
            <span style={{
              font:'600 11px var(--font-mono)',
              color: checkedCount === CHECKLIST_ITEMS.length ? 'var(--accent-green)' : 'var(--text-muted)',
            }}>{checkedCount}/{CHECKLIST_ITEMS.length}</span>
          </div>
          <div className="card">
            {CHECKLIST_ITEMS.map((item, i) => (
              <div className="sop-check" key={i} onClick={()=>toggleCheck(i)}>
                <div className={`sop-checkbox ${checked[i]?'checked':''}`}>
                  {checked[i] && <Icon name="check" size={12}/>}
                </div>
                <span style={{
                  color: checked[i] ? 'var(--text-muted)' : 'var(--text-primary)',
                  textDecoration: checked[i] ? 'line-through' : 'none',
                  transition: 'all 0.2s',
                }}>{item}</span>
              </div>
            ))}
          </div>
          {checkedCount === CHECKLIST_ITEMS.length && (
            <div style={{textAlign:'center',padding:'20px',color:'var(--accent-green)',font:'600 14px var(--font-sans)'}}>
              All steps complete for today!
            </div>
          )}
          <div style={{textAlign:'center',padding:'8px'}}>
            <button onClick={()=>setChecked({})} style={{
              background:'none',border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',
              padding:'8px 16px',color:'var(--text-secondary)',font:'500 12px var(--font-sans)',cursor:'pointer',
            }}>Reset Checklist</button>
          </div>
        </div>
      )}
    </div>
  );
}


// ════════════════════════════════════════════════════
// APP
// ════════════════════════════════════════════════════
function App() {
  const [tab, setTab] = useState('fields');
  const [search, setSearch] = useState('');

  const tabs = [
    {id:'fields', label:'Fields', icon:'fields'},
    {id:'routes', label:'Routes', icon:'routes'},
    {id:'gps', label:'GPS', icon:'gps'},
    {id:'inventory', label:'Trucks', icon:'truck'},
    {id:'supplies', label:'Paint', icon:'supplies'},
    {id:'sop', label:'SOP', icon:'clipboard'},
    {id:'maint', label:'Maint', icon:'wrench'},
    {id:'contacts', label:'Contacts', icon:'contacts'},
  ];

  const showSearch = ['fields','gps','contacts'].includes(tab);

  return (
    <>
      <div className="app-header">
        <div className="header-top">
          <div className="header-logo">TT</div>
          <div>
            <div className="header-title">Turf Tank Ops</div>
            <div className="header-sub">Orange County Parks & Recreation</div>
          </div>
        </div>
        {showSearch && (
          <div className="search-wrap">
            <span className="search-icon"><Icon name="search" size={14}/></span>
            <input
              className="search-input"
              placeholder={`Search ${tab==='fields'?'fields & sites':tab==='gps'?'base stations':'contacts'}...`}
              value={search} onChange={e=>setSearch(e.target.value)}
            />
          </div>
        )}
      </div>

      <div className="content">
        {tab==='fields' && <FieldsView search={search}/>}
        {tab==='routes' && <RoutesView/>}
        {tab==='gps' && <StationsView search={search}/>}
        {tab==='inventory' && <InventoryView/>}
        {tab==='supplies' && <SuppliesView/>}
        {tab==='sop' && <SOPView/>}
        {tab==='maint' && <MaintenanceView/>}
        {tab==='contacts' && <ContactsView search={search}/>}
      </div>

      <nav className="nav-bar">
        {tabs.map(t => (
          <button key={t.id} className={`nav-btn ${tab===t.id?'active':''}`}
            onClick={()=>{setTab(t.id);setSearch('');}}>
            <span className="nav-icon"><Icon name={t.icon} size={18}/></span>
            {t.label}
          </button>
        ))}
      </nav>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
